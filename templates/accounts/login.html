<!DOCTYPE html>
<html>
<head>
    <title>Saarthi | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f4f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px #0000000c;
        }

        h1 { color: #547568; }
        p { color: #777; }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #d8ded9;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #668879;
            color: white;
            border: none;
            border-radius: 9px;
            cursor: pointer;
        }

        a { color: #547568; }
        .error { color: #b42318; }
    </style>
</head>

<body>
<div class="container">

    <h1>Welcome to Saarthi</h1>
    <p>Every Ability. Every Opportunity.</p>
    <p>Login to continue.</p>

    {% for message in messages %}
        <p class="error">{{ message }}</p>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username"
               placeholder="Username" required>

        <input type="password" name="password"
               placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <p>New to Saarthi?
        <a href="{% url 'register' %}">Create an account</a>
    </p>

</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Join Saarthi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f4f0;
            color: #35423d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 25px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px #0000000c;
        }

        h1 { color: #547568; margin-bottom: 5px; }
        p { color: #777; }

        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #d8ded9;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            background: #668879;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background: #4f7061; }
        a { color: #547568; }
        .helptext { font-size: 12px; color: #777; }
        .errorlist { color: #b42318; font-size: 13px; }
    </style>
</head>

<body>
<div class="container">

    <h1>Join Saarthi</h1>
    <p>Every Ability. Every Opportunity.</p>
    <p>Create your account to get started.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Create Account</button>
    </form>

    <p>Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>

</div>
</body>
</html>

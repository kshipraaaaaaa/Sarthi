
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Emergency Contact | Saarthi</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f3f6fb;
            color: #26364a;
        }

         .navbar {
            background: white;
            color: #35423d;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #547568;
        }
        
        .navbar a {
            color: #547568;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            max-width: 650px;
            margin: 55px auto;
            padding: 0 20px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            color: #173f67;
            font-size: 29px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #718096;
            line-height: 1.6;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 22px rgba(30, 60, 90, 0.07);
        }

        .card h2 {
            color: #173f67;
            font-size: 20px;
            margin-bottom: 22px;
        }

        form p {
            margin-bottom: 17px;
        }

        form label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
            color: #42566d;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            font-size: 14px;
            background: #fbfdff;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3984bb;
            box-shadow: 0 0 0 3px rgba(57,132,187,0.12);
        }

        input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button, .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
        }

        .save-btn {
            background: #246b9b;
            color: white;
        }

        .save-btn:hover {
            background: #174f78;
        }

        .cancel-btn {
            background: #e8eef5;
            color: #42566d;
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: #8795a5;
            font-size: 13px;
        }

        @media(max-width: 600px) {
            .container {
                margin: 35px auto;
            }

            .card {
                padding: 22px;
            }

            .heading h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">SAARTHI</div>
        <a href="{% url 'emergency_contacts' %}">← Back to Contacts</a>
    </nav>

    <main class="container">

        <div class="heading">
            <h1>Edit Emergency Contact</h1>
            <p>Keep your trusted contact information accurate and up to date.</p>
        </div>

        <div class="card">
            <h2>Update Contact Details</h2>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="buttons">
                    <button type="submit" class="save-btn">
                        Save Changes
                    </button>

                    <a href="{% url 'emergency_contacts' %}"
                       class="btn cancel-btn">
                        Cancel
                    </a>
                </div>
            </form>
        </div>

    </main>

    <footer class="footer">
        Saarthi · Every Ability. Every Opportunity.
    </footer>

</body>
</html>

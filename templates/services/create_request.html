<!DOCTYPE html>
<html>
<head>
    <title>Request Assistance | Saarthi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 25px;
            background: #f5f4f0;
            font-family: Arial, sans-serif;
            color: #35423d;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: 30px auto;
            padding: 35px;
            border-radius: 18px;
        }

        h1 { color: #547568; }

        label {
            display: block;
            margin-top: 18px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #d8ded9;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #668879;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        a { color: #547568; }
    </style>
</head>

<body>
<div class="container">

    <a href="{% url 'dashboard' %}">← Back to Dashboard</a>

    <h1>Request Assistance</h1>
    <p>Tell us what support you need. We'll help connect you with a volunteer.</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Submit Request</button>
    </form>

</div>
</body>
</html>
